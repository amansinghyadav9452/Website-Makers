<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MØDE — E-commerce Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee8dc;color:#161616;font-family:Inter,system-ui,sans-serif}.nav{position:sticky;top:0;z-index:5;background:#eee8dceb;backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;padding:18px 6vw;border-bottom:1px solid #1111}.logo{font:700 27px Georgia;letter-spacing:3px}.navlinks{display:flex;gap:22px;font-size:13px}.cartbtn{border:1px solid #171717;background:#171717;color:#fff;border-radius:999px;padding:11px 16px}.hero{padding:70px 6vw;display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.hero h1{font:700 clamp(55px,8vw,105px) Georgia;line-height:.82;margin:15px 0}.ey{font:700 10px monospace;letter-spacing:2px;color:#80673c}.hero p{color:#5f5a52;line-height:1.8}.visual{height:510px;border-radius:28px;background:linear-gradient(145deg,#252321,#080808);position:relative;overflow:hidden}.product{position:absolute;width:300px;height:390px;right:11%;top:50%;transform:translateY(-50%) rotate(7deg);border-radius:150px 150px 35px 35px;background:radial-gradient(circle at 35% 25%,#fff1c8,#b68b4c 27%,#27221c 65%);box-shadow:0 40px 80px #0009}.product:after{content:'MØDE';position:absolute;bottom:28px;left:0;right:0;text-align:center;color:#fff;font:700 18px Georgia;letter-spacing:4px}.shop{padding:30px 6vw 90px}.shophead{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.shop h2{font:700 44px Georgia;margin:8px 0}.filters{display:flex;gap:8px}.filters button{border:1px solid #1112;background:transparent;padding:9px 13px;border-radius:999px;cursor:pointer}.filters button.active{background:#171717;color:#fff}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#f8f4eb;border-radius:22px;overflow:hidden}.pic{height:280px;background:linear-gradient(145deg,#d9d0c0,#777064);display:grid;place-items:center}.pic:before{content:'';width:135px;height:190px;border-radius:60px 60px 20px 20px;background:linear-gradient(145deg,#f4e7c8,#75614a);box-shadow:0 25px 40px #0004}.info{padding:18px}.info h3{margin:0 0 6px;font:700 22px Georgia}.info p{color:#777;font-size:13px}.price{font-weight:800}.add{width:100%;margin-top:12px;border:0;background:#171717;color:#fff;padding:12px;border-radius:11px;cursor:pointer}.drawer{position:fixed;inset:0;z-index:20;pointer-events:none}.shade{position:absolute;inset:0;background:#0008;opacity:0;transition:.3s}.panel{position:absolute;right:0;top:0;bottom:0;width:min(410px,92vw);background:#f8f4eb;padding:28px;transform:translateX(100%);transition:.35s;overflow:auto}.drawer.open{pointer-events:auto}.drawer.open .shade{opacity:1}.drawer.open .panel{transform:none}.row{display:flex;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #1111}.checkout{width:100%;padding:14px;border:0;background:#171717;color:#fff;border-radius:12px;margin-top:20px}@media(max-width:800px){.hero{grid-template-columns:1fr}.visual{height:360px}.products{grid-template-columns:1fr}.shophead{display:block}.filters{margin-top:15px;overflow:auto}.navlinks{display:none}}
</style></head><body><nav class="nav"><div class="logo">MØDE</div><div class="navlinks"><a href="#new">New arrivals</a><a href="#shop">Collection</a></div><button class="cartbtn" onclick="toggleCart()">Bag <span id="count">0</span></button></nav><section class="hero"><div><span class="ey">E-commerce demo · Website Makers</span><h1>Less noise.<br>More mode.</h1><p>An actual working storefront concept with product filtering, cart state and a checkout flow. The imaginary store is intentional. The functionality isn't.</p><a class="cartbtn" href="#shop">Shop collection →</a></div><div class="visual"><div class="product"></div></div></section><section class="shop" id="shop"><div class="shophead"><div><span class="ey">Collection</span><h2>Essentials</h2></div><div class="filters"><button class="active" onclick="filter('all',this)">All</button><button onclick="filter('bags',this)">Bags</button><button onclick="filter('objects',this)">Objects</button></div></div><div class="products" id="products"></div></section><div class="drawer" id="drawer"><div class="shade" onclick="toggleCart()"></div><aside class="panel"><button onclick="toggleCart()" style="float:right;border:0;background:none;font-size:28px">×</button><span class="ey">Your bag</span><h2 style="font:700 38px Georgia">Cart</h2><div id="cart"></div><button class="checkout" onclick="alert('Demo checkout: payment gateway would open here.')">Proceed to checkout →</button></aside></div><script>
const items=[['A01','Aster Bag','bags',12900],['O02','Halo Object','objects',5900],['B03','Noir Bag','bags',15900],['O04','Arc Tray','objects',4200],['B05','Studio Tote','bags',8900],['O06','Form Candle','objects',3100]];let cart=[];function render(list=items){document.getElementById('products').innerHTML=list.map((x,i)=>`<article class="card"><div class="pic"></div><div class="info"><h3>${x[1]}</h3><p>Edition ${x[0]} · ${x[2]}</p><div class="price">₹${x[3].toLocaleString('en-IN')}</div><button class="add" onclick="add(${i})">Add to bag</button></div></article>`).join('')}function filter(type,btn){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(type==='all'?items:items.filter(x=>x[2]===type))}function add(i){cart.push(items[i]);document.getElementById('count').textContent=cart.length;renderCart()}function renderCart(){document.getElementById('cart').innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span>${x[1]}</span><b>₹${x[3].toLocaleString('en-IN')}</b></div>`).join(''):`<p style="color:#777">Your bag is empty.</p>`}function toggleCart(){document.getElementById('drawer').classList.toggle('open');renderCart()}render();
</script></body></html>
